<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoriqStars</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #101321;
      color: white;
      font-family: Arial, sans-serif;
    }
    h1 { text-align: center; color: #ffd76a; }
    .subtitle { text-align: center; color: #aeb4ca; }
    .products {
      display: grid;
      gap: 14px;
      max-width: 480px;
      margin: 28px auto;
    }
    .product {
      background: #20263d;
      border: 1px solid #414b70;
      border-radius: 16px;
      padding: 20px;
    }
    .product h2 { margin-top: 0; }
    .product p { color: #c5cbe0; }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #ffd76a;
      color: #171a27;
      font-weight: bold;
      font-size: 15px;
    }
    #details {
      display: none;
      max-width: 480px;
      margin: 20px auto;
      padding: 20px;
      background: #20263d;
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <h1>⭐ ZoriqStars</h1>
  <p class="subtitle">Демонстрационный каталог</p>

  <div class="products">
    <div class="product">
      <h2>⭐ Telegram Stars</h2>
      <p>Демонстрационная карточка Telegram Stars.</p>
      <button onclick="showProduct('Telegram Stars', 'Тестовый товар. Реальная покупка недоступна.')">
        Подробнее
      </button>
    </div>

    <div class="product">
      <h2>💎 Telegram Premium</h2>
      <p>Демонстрационная карточка Premium.</p>
      <button onclick="showProduct('Telegram Premium', 'Тестовый товар. Реальная покупка недоступна.')">
        Подробнее
      </button>
    </div>
  </div>

  <div id="details">
    <h2 id="productName"></h2>
    <p id="productDescription"></p>
    <button onclick="closeProduct()">Назад</button>
  </div>

  <script>
    function showProduct(name, description) {
      document.getElementById('productName').textContent = name;
      document.getElementById('productDescription').textContent = description;
      document.querySelector('.products').style.display = 'none';
      document.getElementById('details').style.display = 'block';
    }

    function closeProduct() {
      document.querySelector('.products').style.display = 'grid';
      document.getElementById('details').style.display = 'none';
    }
  </script>
</body>
</html>
